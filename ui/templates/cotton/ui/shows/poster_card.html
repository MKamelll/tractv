<div class="card bg-base-200 w-96 shadow-sm">
    {% if show.poster_path %}
        <figure>
            <img src={{ show.poster_path }} alt="show poster" />
        </figure>
    {% endif %}
    <div class="card-body">
        <div class="card-actions justify-end">
            <button class="btn btn-primary">Add To Watchlist</button>
        </div>
    </div>
</div>
